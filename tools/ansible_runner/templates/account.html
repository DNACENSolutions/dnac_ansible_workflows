<div class="account-bar">
  {% include 'theme_control.html' %}
  {% if g.runner_user %}
  <details class="account-menu">
    <summary title="Your account" aria-label="Account for {{ g.runner_user.username }}">
      {% include 'account_icons.html' %}
      <span class="account-name">{{ g.runner_user.username }}</span>
      <svg class="account-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
    </summary>
    <div class="account-dropdown">
      <p class="account-role">{{ g.runner_user.role | title }}</p>
      <form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button type="submit" class="account-signout">Sign Out</button></form>
    </div>
  </details>
  {% endif %}
</div>
