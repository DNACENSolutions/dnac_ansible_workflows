---
switch_refresh_sda_fabric_border_work_dir: str(required=False)
switch_refresh_sda_fabric_border_manifest_dir: str(required=False)
switch_refresh_sda_fabric_border_cutover_approved: bool(required=False)
switch_refresh_sda_fabric_border_resume_from_manifest: bool(required=False)
switch_refresh_sda_fabric_border_hostname_transfer_enabled: bool(required=False)
switch_refresh_sda_fabric_border_onboarding_method: enum('discovery', 'lan_automation', required=False)
switch_refresh_sda_fabric_border_inventory_credentials: include('credentials', required=False)
switch_refresh_sda_fabric_border_device_info_lookup_timeout: int(min=1, required=False)
switch_refresh_sda_fabric_border_device_info_lookup_retries: int(min=1, required=False)
switch_refresh_sda_fabric_border_device_info_lookup_interval: int(min=1, required=False)
switch_refresh_sda_fabric_border_inventory_readiness_timeout: int(min=1, required=False)
switch_refresh_sda_fabric_border_provision_validation_timeout: int(min=1, required=False)
switch_refresh_sda_fabric_border_provision_validation_poll_interval: int(min=1, required=False)
switch_refresh_sda_fabric_border_lan_automation_completion_timeout: int(min=1, required=False)
switch_refresh_sda_fabric_border_lan_automation_completion_poll_interval: int(min=1, required=False)
switch_refresh_sda_fabric_border_hostname_transfer_timeout: int(min=1, required=False)
switch_refresh_sda_fabric_border_hostname_transfer_poll_interval: int(min=1, required=False)
switch_refresh_sda_fabric_border_hostname_validation_retries: int(min=1, required=False)
switch_refresh_sda_fabric_border_hostname_validation_interval: int(min=1, required=False)
switch_refresh_sda_fabric_border_batches: list(include('batch'), min=1)
---
credentials:
  username: str()
  password: str()
  enable_password: str(required=False)
  cli_transport: enum('ssh', 'telnet', required=False)
  type: str(required=False)
batch:
  name: str(min=1)
  fabric_site_name_hierarchy: str(min=1)
  onboarding_method: enum('discovery', 'lan_automation', required=False)
  new_devices: include('new_devices')
  device_mapping: list(include('device_mapping'), min=1)
new_devices:
  device_ips: list(str(min=1), min=1)
  discovery_config: list(any(), min=1, required=False)
  lan_automation_config: list(any(), min=1, required=False)
  inventory_config: list(any(), min=1, required=False)
  provision_config: list(any(), min=1, required=False)
device_mapping:
  old: include('old_identifier')
  new: include('new_identifier')
  handoff_interface_mappings: list(include('interface_mapping'), required=False)
old_identifier:
  management_ip: str(min=1, required=False)
  hostname: str(min=1, required=False)
  serial_number: str(min=1, required=False)
  mac_address: str(min=1, required=False)
new_identifier:
  management_ip: str(min=1)
interface_mapping:
  source_interface_name: str(min=1)
  destination_interface_name: str(min=1)
