---
- name: Validate Discovery switch refresh final state
  hosts: catalyst_center_hosts
  connection: local
  gather_facts: false

  vars:
    catalyst_center_login: &catalyst_center_login
      catalystcenter_host: "{{ catalyst_center_host | default(catalystcenter_host) }}"
      catalystcenter_username: "{{ catalyst_center_username | default(catalystcenter_username) }}"
      catalystcenter_password: "{{ catalyst_center_password | default(catalystcenter_password) }}"
      catalystcenter_version: "{{ catalyst_center_version | default(catalystcenter_version) }}"
      catalystcenter_port: "{{ catalyst_center_port | default(443) }}"
      catalystcenter_verify: "{{ catalyst_center_verify | default(catalystcenter_verify) }}"
      catalystcenter_debug: "{{ catalyst_center_debug | default(false) }}"

  tasks:
    - name: Load Discovery validation inputs
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'PWD') }}/workflows/switch_refresh_regression/vars/validate_discovery_en1_en2.yml"

    - name: Query replacement device after refresh
      cisco.catalystcenter.network_device_by_ip_info:
        <<: *catalyst_center_login
        ipAddress: "{{ switch_refresh_validation.replacement_ip }}"
      register: replacement_lookup
      changed_when: false
      failed_when: false

    - name: Query source device after cleanup
      cisco.catalystcenter.network_device_by_ip_info:
        <<: *catalyst_center_login
        ipAddress: "{{ switch_refresh_validation.source_ip }}"
      register: source_lookup
      changed_when: false
      failed_when: false

    - name: Assert Discovery refresh final inventory state
      ansible.builtin.assert:
        that:
          - not (replacement_lookup.failed | default(false))
          - replacement_lookup.dnac_response.response.managementIpAddress | default('') == switch_refresh_validation.replacement_ip
          - source_lookup.dnac_response.response.managementIpAddress | default('') != switch_refresh_validation.source_ip
        fail_msg: >-
          Expected replacement {{ switch_refresh_validation.replacement_name }} at
          {{ switch_refresh_validation.replacement_ip }} to exist and source
          {{ switch_refresh_validation.source_name }} at {{ switch_refresh_validation.source_ip }}
          to be absent after cleanup.
        success_msg: >-
          Discovery refresh final state validated: replacement is present and source is absent.
