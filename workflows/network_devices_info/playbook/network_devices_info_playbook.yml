---
- name: Gather Network Devices Information from Cisco Catalyst Center
  hosts: catalyst_center_hosts
  connection: local
  gather_facts: no


  vars:
    state: gathered
    catalyst_center_login: &catalyst_center_login
      catalystcenter_host: "{{ catalyst_center_host | default(catalystcenter_host) }}"
      catalystcenter_username: "{{ catalyst_center_username | default(catalystcenter_username) }}"
      catalystcenter_password: "{{ catalyst_center_password | default(catalystcenter_password) }}"
      catalystcenter_version: "{{ catalyst_center_version  | default(catalystcenter_version) }}"
      catalystcenter_port: "{{ catalyst_center_port | default(443) }}"
      catalystcenter_verify: "{{ catalyst_center_verify | default(catalystcenter_verify) }}"
      config_verify: "{{ catalyst_center_config_verify | default(False) }}"
      catalystcenter_debug: "{{ catalyst_center_debug | default(False) }}"
      catalystcenter_log: "{{ catalyst_center_log | default(False) }}"
      catalystcenter_log_level: "{{ catalyst_center_log_level | default('INFO') }}"
      catalystcenter_log_file_path: "{{ catalyst_center_log_file_path |  default(omit) }}"
      catalystcenter_log_append: "{{ catalyst_center_log_append |  default(False) }}"
      catalystcenter_api_task_timeout: "{{ catalyst_center_api_task_timeout |  default(1200) }}"

  tasks:
    # =========================================================================
    # Input loading: vars file (VARS_FILE_PATH) or inventory variables
    # =========================================================================
    - name: Load input variables from vars file when VARS_FILE_PATH is provided
      ansible.builtin.include_vars:
        file: "{{ VARS_FILE_PATH }}"
      when:
        - VARS_FILE_PATH is defined
        - VARS_FILE_PATH | length > 0

    - name: Print input source
      ansible.builtin.debug:
        msg: >-
          {{
            'Input source: vars file ' ~ VARS_FILE_PATH
            if (VARS_FILE_PATH is defined and VARS_FILE_PATH | length > 0)
            else 'Input source: inventory / host variables (VARS_FILE_PATH not provided)'
          }}

    - name: Validate that network_devices_info_details is defined
      ansible.builtin.fail:
        msg: >-
          Variable 'network_devices_info_details' is not defined.
          Provide it via VARS_FILE_PATH or as an inventory/host variable.
      when: network_devices_info_details is not defined

    - name: Network devices info workflow start time
      set_fact:
        long_op_start: "{{ now() }}"

    - name: Collect device IPs for inventory readiness checks
      ansible.builtin.set_fact:
        readiness_ips: >-
          {{
            network_devices_info_details
            | map(attribute='network_devices') | flatten
            | map(attribute='device_identifier', default=[]) | flatten
            | map(attribute='ip_address', default=[]) | flatten
            | unique | list
          }}

    - name: Require explicit device IPs for inventory readiness checks
      when: network_devices_info_wait_for_readiness | default(false) | bool
      ansible.builtin.assert:
        that:
          - readiness_ips | length > 0
        fail_msg: "Readiness waiting is enabled. Provide device_identifier.ip_address, or disable network_devices_info_wait_for_readiness for hostname, serial or site queries."

    - name: Authenticate for inventory readiness checks
      when:
        - readiness_ips | length > 0
        - network_devices_info_wait_for_readiness | default(true) | bool
      ansible.builtin.uri:
        url: >-
          https://{{ catalyst_center_login.catalystcenter_host }}:{{ catalyst_center_login.catalystcenter_port }}/dna/system/api/v1/auth/token
        method: POST
        url_username: "{{ catalyst_center_login.catalystcenter_username }}"
        url_password: "{{ catalyst_center_login.catalystcenter_password }}"
        force_basic_auth: true
        validate_certs: "{{ catalyst_center_login.catalystcenter_verify | bool }}"
        return_content: true
        status_code: 200
        timeout: 30
      register: readiness_auth
      no_log: true

    - name: Check inventory readiness before gathering device information
      when:
        - readiness_ips | length > 0
        - network_devices_info_wait_for_readiness | default(true) | bool
      block:
        - name: Wait for each explicit IP query to be ready
          ansible.builtin.include_tasks: tasks/wait_for_inventory.yml
          loop: "{{ network_devices_info_details | map(attribute='network_devices') | flatten }}"
          when: >-
            readiness_query.device_identifier | default([])
            | map(attribute='ip_address', default=[]) | flatten | length > 0
          loop_control:
            loop_var: readiness_query
      rescue:
        - name: Stop when inventory readiness cannot be confirmed
          ansible.builtin.fail:
            msg: >-
              Inventory readiness could not be confirmed for all requested IPs:
              {{ readiness_ips | join(', ') }}. The readiness API failed or a
              device did not become Managed, Reachable, Supported, fully
              collected (SUCCESS), with serial and platform information.
              Device information gathering has not started.

    - name: Gather network devices information from Cisco Catalyst Center
      cisco.catalystcenter.network_devices_info_workflow_manager:
        <<: *catalyst_center_login
        state: "{{ state }}"
        config: "{{ network_devices_info_details }}"
      register: result_network_devices_info

    - name: Display network devices information gathering status
      debug:
        msg:
          - "Network devices information gathering status: {{ result_network_devices_info.status }}"
          - "Number of query sets processed: {{ result_network_devices_info.response | length }}"

    - name: Display network devices information results
      debug:
        var: result_network_devices_info

    - name: Display network devices information summary
      debug:
        msg:
          - "Network Devices Info workflow completed"
          - "Total device queries processed: {{ result_network_devices_info.response | length }}"
          - "Status: {{ result_network_devices_info.status }}"
      when: result_network_devices_info.status == "success"

    - name: Network devices info workflow end time
      set_fact:
        long_op_end: "{{ now() }}"

    - name: Print network devices info workflow execution time
      debug:
        msg: "Network devices info workflow run time: {{ long_op_start }}, end: {{ long_op_end }}"

  post_tasks:
    - name: Check Python version on Catalyst Center host
      ansible.builtin.command: which python
      register: ansible_play_path
      delegate_to: catalyst_center_hosts
      connection: local
